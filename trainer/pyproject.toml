[project]
name = "trainer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["nanobind>=3.1.0"]

[project.scripts]
trainer = "trainer:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cpu = ["torch==2.15.0"]
gfx1100 = ["torch[device-gfx1100]==2.15.0+rocm10.2.0; sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch", extra = "cpu" },
    { index = "pytorch-rocm", extra = "gfx1100" },
]

[tool.uv]
conflicts = [[{ extra = "gfx1100" }, { extra = "cpu" }]]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
